[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# NOTE: this file MUST stay pure ASCII.
# Alembic reads it with configparser(encoding="locale"), so on a Chinese Windows
# (locale=GBK) any non-ASCII byte here crashes `alembic upgrade head` with
# UnicodeDecodeError before the migration even starts. Keep comments in English;
# Chinese belongs in .py / .md files, which are read as UTF-8.
# The DB URL is intentionally NOT set here (it would carry the password):
# alembic/env.py reads it from the DATABASE_URL environment variable.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
