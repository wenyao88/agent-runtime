services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.siliconflow.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-ai/DeepSeek-V3}
      - DATABASE_URL=postgresql+asyncpg://agent:agent@postgres:5432/agent_runtime
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./skills:/app/skills

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata: